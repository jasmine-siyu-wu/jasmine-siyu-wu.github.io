<script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>
<script>
  (function () {
    var menuButton = document.querySelector("#site-nav > button");
    var hiddenLinks = document.querySelector("#site-nav .hidden-links");
    if (!menuButton || !hiddenLinks) return;
    menuButton.addEventListener("click", function () {
      menuButton.setAttribute("aria-expanded", String(!hiddenLinks.classList.contains("hidden")));
    });
  }());
</script>
